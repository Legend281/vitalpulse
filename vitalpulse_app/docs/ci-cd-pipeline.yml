# VitalPulse CI/CD — GitHub Actions reference pipeline with blocking security gates
# Place at .github/workflows/ci-cd.yml
# Environments required in repo settings: staging, production (production: required reviewers).
# Secrets per environment: FIREBASE_SERVICE_ACCOUNT (least-privilege deployer), FIREBASE_PROJECT_ID.

name: vitalpulse-ci-cd

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read
  security-events: write
  id-token: write   # for Workload Identity Federation (preferred over JSON keys)

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ---------------- GATE 1: hygiene + secrets ----------------
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }          # scan full history
      - name: Gitleaks (BLOCKING)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint-and-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  # ---------------- GATE 2: SAST + dependencies ----------------
  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Semgrep (BLOCKING on findings)
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/owasp-top-ten
            p/javascript
            p/secrets

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - name: npm audit (BLOCKING on high/critical)
        run: npm audit --audit-level=high

  # ---------------- GATE 3: tests ----------------
  unit-tests:
    runs-on: ubuntu-latest
    needs: [lint-and-types]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - name: Unit tests + coverage gate
        run: npm run test:unit -- --coverage
        # configure coverage thresholds in vitest/jest config:
        # 90% on functions authz branches, 80% global (fails build if below)

  rules-tests:
    runs-on: ubuntu-latest
    needs: [lint-and-types]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci && npm i -g firebase-tools
      - name: Firestore Security Rules tests (BLOCKING)
        run: firebase emulators:exec --only firestore "npm run test:rules"

  build:
    runs-on: ubuntu-latest
    needs: [unit-tests, rules-tests, sast, secret-scan, dependency-audit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci && npm run build
      - uses: actions/upload-artifact@v4
        with: { name: web-dist, path: dist/ }

  # ---------------- STAGING (on merge to main) ----------------
  deploy-staging:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [build]
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: web-dist, path: dist/ }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci && npm i -g firebase-tools
      - name: Deploy RULES FIRST, then functions, then hosting
        run: |
          firebase deploy --only firestore:rules --project "$PROJECT" --force
          firebase deploy --only functions --project "$PROJECT" --force
          firebase deploy --only hosting --project "$PROJECT"
        env:
          PROJECT: ${{ secrets.FIREBASE_PROJECT_ID }}
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

  staging-integration-tests:
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - name: Integration tests vs staging (synthetic data only)
        run: npm run test:integration
        env:
          STAGING_URL: ${{ vars.STAGING_URL }}

  dast-zap:
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    steps:
      - name: OWASP ZAP baseline scan (BLOCKING on high)
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: ${{ vars.STAGING_URL }}
          fail_action: true

  smoke-load-test:
    runs-on: ubuntu-latest
    needs: [staging-integration-tests]
    steps:
      - uses: actions/checkout@v4
      - name: k6 smoke (reduced S1 scenario)
        uses: grafana/k6-action@v0.3.1
        with:
          filename: k6-stress-tests.js
        env:
          K6_SCENARIO: smoke
          TARGET_URL: ${{ vars.STAGING_URL }}

  # ---------------- PRODUCTION (tag + manual approval) ----------------
  deploy-production:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [dast-zap, smoke-load-test]
    environment: production   # protected: requires manual reviewer approval
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: web-dist, path: dist/ }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci && npm i -g firebase-tools
      - name: Deploy to production (rules -> functions -> hosting)
        run: |
          firebase deploy --only firestore:rules --project "$PROJECT" --force
          firebase deploy --only functions --project "$PROJECT" --force
          firebase deploy --only hosting --project "$PROJECT"
        env:
          PROJECT: ${{ secrets.FIREBASE_PROJECT_ID }}
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

  post-deploy-smoke:
    runs-on: ubuntu-latest
    needs: [deploy-production]
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - name: Production smoke tests
        run: npm run test:smoke
        env:
          PROD_URL: ${{ vars.PROD_URL }}
      - name: Rollback hosting on failure
        if: failure()
        run: |
          npm i -g firebase-tools
          firebase hosting:rollback --project "$PROJECT" --non-interactive
        env:
          PROJECT: ${{ secrets.FIREBASE_PROJECT_ID }}
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
