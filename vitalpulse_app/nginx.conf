server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 256;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # This is a multi-page app (index/login/signup/donor/hospital/admin/about.html) —
    # every in-app link uses an explicit .html URL, so a SPA-style fallback to
    # index.html isn't needed for navigation and just turns real 404s (typos, bots
    # probing paths) into silent 200s serving the homepage. Serve real files, 404
    # otherwise; the `index` directive above still resolves `/` to index.html.
    location / {
        try_files $uri $uri/ =404;

        # Cache static assets
        location ~* \.(js|css|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # Block access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
